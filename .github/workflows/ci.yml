name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, property and fixture-conformance tests
        run: npm test

      - name: Documentation checks
        run: npm run docs:check

      - name: Format check
        run: npm run format:check

      - name: Production build
        run: npm run build

      - name: Route smoke test
        run: npm run smoke

      - name: Dependency audit (informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
