name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality (lint, types, unit tests, build, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, property and fixture-conformance tests
        run: npm test

      - name: Documentation checks
        run: npm run docs:check

      - name: Format check
        run: npm run format:check

      - name: Production dependency license audit
        run: npm run licenses

      - name: Production build
        run: npm run build

      - name: Route smoke test
        run: npm run smoke

      - name: Dependency audit (informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # The same specs run in each real engine in parallel, so one slow or flaky engine cannot hide the others and the
  # wall-clock time is that of the slowest engine rather than the sum.
  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproducible)
        run: npm ci

      - name: Production build (the specs run against `next start`)
        run: npm run build

      - name: Install ${{ matrix.browser }} for real-engine tests
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Real-browser tests in ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Keep browser traces of failed or flaky tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # One required check that stands for everything above. Its name is the one branch protection already knows.
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    needs: [quality, browsers]
    if: always()
    steps:
      - name: All jobs must have succeeded
        env:
          QUALITY: ${{ needs.quality.result }}
          BROWSERS: ${{ needs.browsers.result }}
        run: |
          echo "quality: $QUALITY"
          echo "browsers: $BROWSERS"
          test "$QUALITY" = "success" && test "$BROWSERS" = "success"
